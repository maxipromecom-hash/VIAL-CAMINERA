name: Compilar Verificador Vial Caminera

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name Verificador_Vial_Caminera `
            --collect-all selenium `
            --collect-all openpyxl `
            verificador_vial.py

      - name: Publicar ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: Verificador_Vial_Caminera-Windows
          path: dist/Verificador_Vial_Caminera.exe
          if-no-files-found: error
